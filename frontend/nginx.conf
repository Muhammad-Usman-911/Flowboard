# Serves the built React app and forwards API + WebSocket traffic to the "api" service.
# Because the browser sees a single origin, no CORS is needed in the Docker setup.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;  # uploads are capped at 10 MB by the API

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;     # these two headers turn the HTTP
        proxy_set_header Connection "upgrade";      # request into a WebSocket
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location ~ ^/(docs|redoc|openapi.json|health) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Single-page app: unknown paths (e.g. /boards/3) load index.html; React Router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
